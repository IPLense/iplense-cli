name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck iplense.sh tests/run.sh tests/stub/curl
      - name: Snapshot tests
        run: bash tests/run.sh
